<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专注计时器</title>
<!-- 百度统计 -->
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?3218fe7cd65a2aa1e362a4be76dae81d";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f6f6f4;--bg3:#f0efe9;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#9e9e9e;
  --border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.22);
  --green-bg:#edf7ee;--green-text:#2d7a38;--green-border:rgba(45,122,56,.35);
  --yellow-bg:#fdf6e3;--yellow-text:#856404;--yellow-border:rgba(133,100,4,.3);
  --blue-bg:#eef4fb;--blue-text:#1a5fa8;--blue-border:rgba(26,95,168,.3);
  --red-text:#b91c1c;--red-border:rgba(185,28,28,.35);--red-bg:#fef2f2;
  --radius:10px;--radius-lg:14px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
    --text:#f0f0f0;--text2:#a0a0a0;--text3:#666;
    --border:rgba(255,255,255,.12);--border2:rgba(255,255,255,.22);
    --green-bg:rgba(45,122,56,.2);--green-text:#5ec96b;--green-border:rgba(94,201,107,.3);
    --yellow-bg:rgba(133,100,4,.2);--yellow-text:#e3b84e;--yellow-border:rgba(227,184,78,.3);
    --blue-bg:rgba(26,95,168,.2);--blue-text:#6ba8e0;--blue-border:rgba(107,168,224,.3);
    --red-text:#f87171;--red-border:rgba(248,113,113,.35);--red-bg:rgba(185,28,28,.2);
  }
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;min-height:100vh}
.wrap{max-width:580px;margin:0 auto;padding:2rem 1.25rem 3rem}
.phase{display:none}.phase.active{display:block}

/* typography */
h1{font-size:22px;font-weight:600;color:var(--text)}
.sub{font-size:13px;color:var(--text2)}
.label-xs{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:5px;display:block}

/* card */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem}

/* buttons */
button{font-family:inherit;cursor:pointer;transition:opacity .12s,background .12s,transform .08s;border-radius:var(--radius);font-size:14px;font-weight:500}
button:active{transform:scale(.97)}
.btn-primary{background:var(--text);color:var(--bg);border:none;padding:10px 20px}
.btn-primary:hover{opacity:.82}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2);padding:9px 18px}
.btn-ghost:hover{background:var(--bg2)}
.btn-sm-danger{background:transparent;border:1px solid var(--red-border);color:var(--red-text);padding:6px 12px;font-size:12px;border-radius:8px}
.btn-sm-danger:hover{background:var(--red-bg)}
.btn-done{width:100%;display:flex;align-items:center;gap:10px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--radius);padding:13px 16px;margin-bottom:.9rem;color:var(--green-text)}
.btn-done:hover{opacity:.85}
.btn-done .icon{width:22px;height:22px;border-radius:50%;background:var(--green-text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-done .icon i{color:var(--green-bg);font-size:13px}

/* textarea & input */
textarea{width:100%;min-height:76px;font-size:15px;resize:vertical;border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;font-family:inherit;color:var(--text);background:var(--bg2);outline:none;transition:box-shadow .15s}
textarea:focus{box-shadow:0 0 0 2.5px rgba(0,0,0,.15)}
input[type=time]{border:none;background:transparent;font-size:14px;font-weight:600;color:var(--text);font-family:inherit;outline:none;cursor:pointer;width:82px}

/* time row */
.time-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.time-pill{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px}
.time-pill label{font-size:12px;color:var(--text3);white-space:nowrap}
.end-badge{font-size:14px;font-weight:600;color:var(--text);padding:6px 11px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius)}

/* current task mini card */
.cur-card{background:var(--bg2);border-radius:var(--radius);padding:.9rem 1.1rem;margin-bottom:1.25rem}

/* choice buttons — the key fix: clear selected state */
.choice-row{display:flex;gap:10px;margin-top:.75rem;flex-wrap:wrap}
.choice-btn{flex:1;min-width:130px;padding:13px 12px;font-size:14px;font-weight:500;border-radius:var(--radius);border:2px solid var(--border);background:var(--bg2);color:var(--text);transition:border-color .15s,background .15s,color .15s}
.choice-btn:hover{border-color:var(--border2);background:var(--bg)}
.choice-btn.selected{border-color:var(--text);background:var(--text);color:var(--bg)}
.choice-btn.selected:hover{opacity:.88}
.choice-btn i{display:block;margin-bottom:5px;font-size:18px}

/* slider */
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.slider-row input[type=range]{flex:1;accent-color:var(--text)}
.pct{font-size:14px;font-weight:600;color:var(--text);min-width:36px;text-align:right}

/* notice banner */
.notice{font-size:12px;color:var(--yellow-text);background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:var(--radius);padding:7px 11px;margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* history */
.hist-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.dot-done{background:var(--green-bg)}.dot-done i{color:var(--green-text);font-size:12px}
.dot-partial{background:var(--yellow-bg)}.dot-partial i{color:var(--yellow-text);font-size:12px}

/* timer ring */
.timer-center{text-align:center;padding:1.25rem 0 .75rem}
.end-row{text-align:center;font-size:13px;color:var(--text2);margin-bottom:1.1rem}

/* rest */
.rest-big{font-size:60px;font-weight:600;letter-spacing:-2px;color:var(--text);font-variant-numeric:tabular-nums;text-align:center;padding:1.5rem 0 .5rem}

/* session dots */
.dots-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:1.1rem}
.s-dot{width:9px;height:9px;border-radius:50%}

/* divider */
hr{border:none;border-top:1px solid var(--border);margin:1rem 0}

/* modal overlay */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg);border-radius:var(--radius-lg);padding:1.5rem;max-width:360px;width:100%;border:1px solid var(--border)}
.modal-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:.6rem}
.modal-body{font-size:14px;color:var(--text2);margin-bottom:1.25rem;line-height:1.6}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}

@media(max-width:480px){.wrap{padding:1.25rem .9rem 3rem}}

/* ── 实时可视化方块 ── */
.vis-event-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.vis-event-name{font-size:12px;color:var(--text2);white-space:nowrap;flex-shrink:0}
.vis-event-name.vis-hl{color:#7a1e1e;font-weight:600}
.vis-blocks{display:flex;gap:3px;align-items:center}

/* ── 引导动画 ── */
.onboard-overlay{z-index:300}
.onboard-box{max-width:320px;text-align:center;padding:1.9rem 1.6rem 1.5rem;position:relative}
.onboard-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--text3);font-size:15px;cursor:pointer;padding:6px;line-height:1}
.onboard-close:hover{color:var(--text)}
.onboard-icon{width:38px;height:38px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--text)}
.onboard-icon i{font-size:18px}
.onboard-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:18px;line-height:1.4}
.onboard-anim{position:relative;height:96px;margin:0 auto 16px}
.ob-frame{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.ob-frame-a{animation:obShowA 2.8s infinite}
.ob-frame-b{animation:obShowB 2.8s infinite}
@keyframes obShowA{0%,42%{opacity:1}50%,100%{opacity:0}}
@keyframes obShowB{0%,42%{opacity:0}58%,92%{opacity:1}100%{opacity:0}}
@keyframes obBlinkCursor{0%,50%{opacity:1}51%,100%{opacity:0}}
.onboard-dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.ob-dot{width:6px;height:6px;border-radius:50%;background:var(--border2)}
.ob-dot.on{background:var(--text)}
.onboard-actions{display:flex;align-items:center;justify-content:space-between}
.onboard-skip{font-size:13px;color:var(--text3);cursor:pointer}
.onboard-skip:hover{color:var(--text2)}
.ob-replay-btn{position:fixed;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--border2);background:var(--bg);color:var(--text2);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:150;font-size:13px;font-weight:600}
.ob-replay-btn:hover{color:var(--text);border-color:var(--text2)}
</style>
</head>
<body>

<!-- ── 引导动画 ── -->
<div class="modal-overlay onboard-overlay" id="onboardOverlay">
  <div class="modal-box onboard-box">
    <button class="onboard-close" onclick="skipOnboarding()" aria-label="关闭">✕</button>
    <div class="onboard-icon" id="obIcon"><i class="ti ti-clipboard-text"></i></div>
    <div class="onboard-title" id="obTitle">填好任务，开始专注</div>
    <div class="onboard-anim" id="obAnim"></div>
    <div class="onboard-dots" id="obDots"></div>
    <div class="onboard-actions">
      <span class="onboard-skip" onclick="skipOnboarding()">跳过</span>
      <div style="display:flex;gap:8px">
        <button class="btn-ghost" id="obBackBtn" onclick="obPrev()" style="display:none;white-space:nowrap">上一步</button>
        <button class="btn-primary" id="obNextBtn" onclick="obNext()">下一步 →</button>
      </div>
    </div>
  </div>
</div>
<button class="ob-replay-btn" id="obReplayBtn" onclick="startOnboarding()" title="查看使用引导">?</button>

<!-- SVG hatch patterns for vis blocks -->
<svg width="0" height="0" style="position:absolute;pointer-events:none">
  <defs>
    <pattern id="vis-hg" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999" stroke-width="1.3"/>
    </pattern>
    <pattern id="vis-hr" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7a1e1e" stroke-width="1.3"/>
    </pattern>
  </defs>
</svg>
<div class="wrap">

<!-- ── SETUP ── -->
<div id="phaseSetup" class="phase active">
  <div style="margin-bottom:1.2rem">
    <h1>本轮任务</h1><span class="sub" style="margin-left:8px">设定接下来30分钟要完成什么</span>
  </div>

  <!-- 选项卡 -->
  <div style="display:flex;gap:6px;margin-bottom:1rem">
    <button id="tabPlan" onclick="switchTab('plan')" style="flex:1;padding:8px;font-size:13px;font-weight:500;border-radius:var(--radius);border:1px solid var(--border2);background:var(--text);color:var(--bg);cursor:pointer">我有计划</button>
    <button id="tabAI" onclick="switchTab('ai')" style="flex:1;padding:8px;font-size:13px;font-weight:500;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer">懒蛋人类</button>
  </div>

  <div class="card">
    <!-- 我有计划模式 -->
    <div id="modePlan">
      <div id="carryNotice" class="notice" style="display:none">
        <i class="ti ti-arrow-right" style="font-size:13px;flex-shrink:0"></i>
        <span>上一轮未完成，已自动带入——可直接编辑</span>
      </div>
      <div class="time-row">
        <div class="time-pill">
          <label>开始</label>
          <input type="time" id="startTimeInput" onchange="updateEndTime('plan')">
          <button onclick="resetToNow('plan')" title="刷新为当前时间" style="background:none;border:none;padding:0 0 0 4px;cursor:pointer;color:var(--text3);display:flex;align-items:center;transition:color .15s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text3)'">
            <i class="ti ti-refresh" style="font-size:15px"></i>
          </button>
        </div>
        <span style="font-size:13px;color:var(--text3)">→</span>
        <div class="end-badge" id="endTimeBadge">30 分钟后</div>
      </div>
      <span class="label-xs">我想在30分钟内完成…</span>
      <textarea id="taskInput" placeholder="例：写完第三章公式（1）的推导，约三句话"></textarea>

      <!-- 任务列表折叠面板：跟【人】结构一致，但没有调AI的入口 -->
      <div id="planTaskPanel" style="display:none;margin-top:10px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
        <button onclick="toggleTaskPanel(planState)" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--bg2);border:none;color:var(--text2);font-size:13px;cursor:pointer;text-align:left">
          <span id="planTaskPanelLabel">待办任务</span>
          <i class="ti ti-chevron-down" id="planTaskPanelIcon" style="font-size:14px;transition:transform .2s"></i>
        </button>
        <div id="planTaskPanelBody" style="padding:8px 0">
          <div id="planTaskList"></div>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <span id="charCount" style="font-size:12px;color:var(--text3)">0 字</span>
        <button class="btn-primary" id="startBtn" onclick="_hmt.push(['_trackEvent','按钮','开始专注','计划模式']);startSession()" disabled>开始专注 →</button>
      </div>
    </div>

    <!-- 懒蛋人类模式 -->
    <div id="modeAI" style="display:none">
      <div class="time-row">
        <div class="time-pill">
          <label>开始</label>
          <input type="time" id="startTimeInputAI" onchange="updateEndTime('ai')">
          <button onclick="resetToNow('ai')" title="刷新为当前时间" style="background:none;border:none;padding:0 0 0 4px;cursor:pointer;color:var(--text3);display:flex;align-items:center;transition:color .15s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text3)'">
            <i class="ti ti-refresh" style="font-size:15px"></i>
          </button>
        </div>
        <span style="font-size:13px;color:var(--text3)">→</span>
        <div class="end-badge" id="endTimeBadgeAI">30 分钟后</div>
      </div>
      <span class="label-xs">今天想做什么？随便说，AI来拆</span>
      <textarea id="aiGoalInput" placeholder="今天想做什么？随便说，AI来拆。&#10;例：「我要写工作报告」或「昨天写到引言第二段，今天接着写」" style="min-height:76px"></textarea>

      <!-- 任务列表折叠面板 -->
      <div id="aiTaskPanel" style="display:none;margin-top:10px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
        <button onclick="toggleTaskPanel(aiState)" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--bg2);border:none;color:var(--text2);font-size:13px;cursor:pointer;text-align:left">
          <span id="taskPanelLabel">待办任务</span>
          <i class="ti ti-chevron-down" id="taskPanelIcon" style="font-size:14px;transition:transform .2s"></i>
        </button>
        <div id="taskPanelBody" style="padding:8px 0">
          <div id="aiTaskList"></div>
          <div style="padding:6px 12px 2px;border-top:1px solid var(--border);margin-top:4px">
            <button onclick="askAnotherBatch()" style="background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:4px" onmouseover="this.style.color='var(--text2)'" onmouseout="this.style.color='var(--text3)'" title="重新问AI，拆出新的任务追加到列表末尾">
              <i class="ti ti-sparkles" style="font-size:13px"></i>有别的任务要拆
            </button>
          </div>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <span id="aiStatus" style="font-size:12px;color:var(--text3)"></span>
        <div style="display:flex;gap:8px">
          <button id="aiStartBtn" class="btn-primary" onclick="_hmt.push(['_trackEvent','按钮','开始专注','AI模式']);startSessionFromAI()" style="display:none">开始专注 →</button>
          <button id="aiAskBtn" class="btn-primary" onclick="_hmt.push(['_trackEvent','按钮','AI拆解']);askAI()">让AI来拆 ✦</button>
        </div>
      </div>
    </div>
  </div>

  <div id="historySection" style="display:none;margin-top:1.5rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <span class="label-xs" style="margin-bottom:0">今日记录</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="histSummary" style="font-size:12px;color:var(--text3)"></span>
        <button onclick="_hmt.push(['_trackEvent','按钮','导出','文字版']);exportTxt()" style="background:transparent;border:1px solid var(--border2);color:var(--text2);padding:4px 10px;font-size:12px;border-radius:8px;cursor:pointer" title="导出文字版">
          <i class="ti ti-file-text" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>文字版
        </button>
        <button onclick="_hmt.push(['_trackEvent','按钮','导出','可视化版']);exportVis()" style="background:transparent;border:1px solid var(--border2);color:var(--text2);padding:4px 10px;font-size:12px;border-radius:8px;cursor:pointer" title="导出可视化版">
          <i class="ti ti-chart-bar" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>可视化版
        </button>
      </div>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<!-- ── TIMER ── -->
<div id="phaseTimer" class="phase">
  <div class="cur-card">
    <span class="label-xs" id="timerCardLabel">本轮目标</span>
    <div id="timerTaskLabel" style="font-size:15px;line-height:1.5;margin-top:2px"></div>
    <div id="restingNote" style="display:none;font-size:12px;color:var(--blue-text);margin-top:6px">
      <i class="ti ti-coffee"></i> 休息中 · 任务计时已暂存，点「结束休息」继续
    </div>
  </div>
  <div class="dots-row" id="sessionDots"></div>
  <div class="timer-center">
    <svg overflow="visible" width="170" height="170" viewBox="0 0 170 170" style="display:block;margin:0 auto .9rem">
      <circle cx="85" cy="85" r="78" fill="none" stroke="var(--border)" stroke-width="6"/>
      <circle id="ringFill" cx="85" cy="85" r="78" fill="none" stroke="var(--text)" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="490.1" stroke-dashoffset="490.1" transform="rotate(-90 85 85)"/>
      <text x="85" y="81" text-anchor="middle" font-size="40" font-weight="600" fill="var(--text)" id="timerText">30:00</text>
      <text x="85" y="102" text-anchor="middle" font-size="12" fill="var(--text3)" id="timerSubLabel">剩余</text>
    </svg>
  </div>
  <div class="end-row">计划结束：<strong id="timerEndLabel" style="color:var(--text)">—</strong></div>
  <div id="overtimeBuffer" class="notice" style="display:none;text-align:center">
    时间到了！<strong id="bufferCountdown">8</strong> 秒后自动继续正计时
    <div style="margin-top:.7rem">
      <button class="btn-primary" onclick="endRoundFromBuffer()">结束本轮 →</button>
    </div>
  </div>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button class="btn-ghost" id="pauseBtn" onclick="togglePause()">暂停</button>
    <button class="btn-ghost" id="earlyBtn" onclick="earlyFinish()" style="color:var(--green-text);border-color:var(--green-border)">提前结束</button>
    <button class="btn-ghost" id="restToggleBtn" onclick="toggleRest()" style="color:var(--blue-text);border-color:var(--blue-border)">休息 ☕</button>
    <button class="btn-ghost" id="overtimeStopBtn" onclick="stopOvertime()" style="color:var(--red-text);border-color:var(--red-border);display:none">时间到 →</button>
  </div>
</div>

<!-- ── EARLY FINISH ── -->
<div id="phaseEarly" class="phase">
  <div class="cur-card" style="margin-bottom:1.25rem">
    <span class="label-xs">本轮任务</span>
    <div id="earlyTaskLabel" style="font-size:15px;line-height:1.5;margin-top:2px"></div>
  </div>
  <div class="card">
    <div style="font-size:16px;font-weight:600;margin-bottom:.9rem">提前结束，接下来？</div>
    <div class="choice-row">
      <button class="choice-btn" id="choiceNext" onclick="selectChoice('next')" style="display:none">
        <i class="ti ti-arrow-right"></i>下一个任务
      </button>
      <button class="choice-btn" id="choiceDone" onclick="selectChoice('done')">
        <i class="ti ti-check"></i><span id="choiceDoneLabel">完成！</span>
      </button>
      <button class="choice-btn" id="choicePartial" onclick="selectChoice('partial')">
        <i class="ti ti-progress"></i>未完成！
      </button>
    </div>
    <div style="margin-top:1rem;text-align:right">
      <button class="btn-primary" id="earlyConfirmBtn" onclick="confirmEarlyChoice()" disabled>确认 →</button>
    </div>
  </div>
</div>

<!-- ── FEEDBACK ── -->
<div id="phaseFeedback" class="phase">
  <div class="cur-card" style="margin-bottom:1.1rem">
    <span class="label-xs">本轮目标</span>
    <div id="feedbackTaskLabel" style="font-size:15px;line-height:1.5;margin-top:2px"></div>
  </div>
  <div style="font-size:17px;font-weight:600;margin-bottom:1rem">完成得怎么样？</div>
  <div class="card">
    <div id="doneBtnWrap">
    <button class="btn-done" onclick="markDone()">
      <div class="icon"><i class="ti ti-check"></i></div>
      <span style="font-size:15px;font-weight:600">全部完成 ✓</span>
    </button>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:.9rem">
      <div style="font-size:13px;color:var(--text2);margin-bottom:10px">没做完——大约完成了：</div>
      <div class="slider-row">
        <input type="range" min="0" max="95" step="5" value="50" id="progressSlider" oninput="updateSlider(this.value)">
        <span class="pct" id="sliderPct">50%</span>
      </div>
      <button class="btn-primary" style="width:100%;padding:11px" onclick="_hmt.push(['_trackEvent','按钮','记录进度']);markPartial()">记录进度，继续下一轮 →</button>
    </div>
  </div>
</div>

</div>

<!-- reset modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal-box">
    <div class="modal-title">重置今日记录</div>
    <div class="modal-body">确定要清空今日所有记录吗？共 <strong id="resetCount">0</strong> 条，此操作不可撤销。</div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeReset()">取消</button>
      <button class="btn-sm-danger" style="padding:9px 16px;font-size:14px" onclick="doReset()">确认清空</button>
    </div>
  </div>
</div>

<!-- delete task modal：【我】【人】共用同一个弹窗 -->
<div class="modal-overlay" id="deleteTaskModal">
  <div class="modal-box">
    <div class="modal-title">删除这条任务</div>
    <div class="modal-body">确定要删除「<strong id="deleteTaskText"></strong>」吗？此操作不可撤销。</div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeDeleteTask()">取消</button>
      <button class="btn-sm-danger" style="padding:9px 16px;font-size:14px" onclick="confirmDeleteTask()">确认删除</button>
    </div>
  </div>
</div>

<script>
const DURATION=30*60;
let timeLeft=DURATION,timerInterval=null,restInterval=null;
let isPaused=false,currentTask='',history=[],sessionCount=0;
let lastUnfinishedTask=null,sessionEndTime=null,earlyChoice=null,sessionStartTime=null;
let deadlineTs=null,pausedTimeLeft=null; // 方案一：时间戳计时

// ── 超时（正计时）相关 ──
let timerMode='down';            // 'down' 倒计时 | 'buffer' 8秒缓冲 | 'up' 正计时
let bufferInterval=null,bufferLeft=8;
let overtimeBaseSec=0,overtimeSegStart=null; // 正计时累计 + 当前运行段起点
let currentBlocks=1;             // 本轮结算时写入 history 的方块数
// ── 休息（影子任务，与计时共享同一条时间线） ──
let isResting=false;             // 当前显示名是否为「休息」
let segments=[];                 // 本轮已切出的分段 [{name, mins}]，name 为 currentTask 或 '休息'
let segBaseSec=0,segStart=null;  // 当前分段已计累计秒 + 本次运行起点（配合暂停）
let earlyEndTime=null;           // 提前结束时自动捕获的时刻
let feedbackContext='normal';    // 'normal' | 'earlyPlan' | 'earlyAI'

// ── 【我】【人】两套任务列表状态，结构完全对称。所有列表相关函数（渲染/选中/增删/拖拽/
// 开始按钮判定）都是通用函数，接收 state 参数决定操作哪一套，不再各写一份 ──
const planState={
  mode:'plan', tasks:[], completed:new Set(), inProgress:new Set(),
  taskIndex:-1, editingIndex:null, runningIndex:null, open:true,
  inputId:'taskInput', startBtnId:'startBtn',
  listId:'planTaskList', panelId:'planTaskPanel', panelLabelId:'planTaskPanelLabel',
  panelBodyId:'planTaskPanelBody', panelIconId:'planTaskPanelIcon'
};
const aiState={
  mode:'ai', tasks:[], completed:new Set(), inProgress:new Set(),
  taskIndex:-1, editingIndex:null, runningIndex:null, open:true,
  inputId:'aiGoalInput', startBtnId:'aiStartBtn',
  listId:'aiTaskList', panelId:'aiTaskPanel', panelLabelId:'taskPanelLabel',
  panelBodyId:'taskPanelBody', panelIconId:'taskPanelIcon'
};

const taskInput=document.getElementById('taskInput');

function fmt(n){return String(n).padStart(2,'0')}
function nowHM(){const n=new Date();return fmt(n.getHours())+':'+fmt(n.getMinutes());} // 抓取「此刻」真实时钟时间，用于覆盖预先算好的计划结束时间
function addMins(t,mins){
  const[h,m]=t.split(':').map(Number);
  const d=new Date();d.setHours(h,m+mins,0,0);
  return fmt(d.getHours())+':'+fmt(d.getMinutes());
}

// ── 时间相关：合并成参数化版本，mode 传 'plan' 或 'ai'。
// 两边现在都会正确设置 sessionEndTime，不再是只有【我】会设——
// 这也是第6点讨论过的那个「藏起来的不对称」，这次顺手一起修掉 ──
function timeInputId(mode){return mode==='ai'?'startTimeInputAI':'startTimeInput';}
function endBadgeId(mode){return mode==='ai'?'endTimeBadgeAI':'endTimeBadge';}
function updateEndTime(mode){
  mode=mode||'plan';
  const v=document.getElementById(timeInputId(mode)).value;
  if(!v){document.getElementById(endBadgeId(mode)).textContent='30 分钟后';sessionEndTime=null;return;}
  const end=addMins(v,30);
  document.getElementById(endBadgeId(mode)).textContent=end;
  sessionEndTime=end;
}
function resetToNow(mode){
  mode=mode||'plan';
  const n=new Date();
  document.getElementById(timeInputId(mode)).value=fmt(n.getHours())+':'+fmt(n.getMinutes());
  updateEndTime(mode);
  renderHistory();
}
function initStartTime(){
  const n=new Date();
  const val=fmt(n.getHours())+':'+fmt(n.getMinutes());
  document.getElementById('startTimeInput').value=val;
  document.getElementById('startTimeInputAI').value=val;
  updateEndTime('plan');
  updateEndTime('ai');
}

// ── 「开始专注」按钮启用条件：【我】三档，【人】规则不变 ──
// 0条/1条 = 看文本框有没有字；≥2条 = 看有没有选中列表某一条（跟【人】完全一致）
// 【人】本身的规则维持原样：始终必须选中列表某一条
function updateStartBtnState(state){
  const n=state.tasks.length;
  const inputEl=document.getElementById(state.inputId);
  const hasText=inputEl.value.trim().length>0;
  const enabled = state.mode==='plan'
    ? (n>=2 ? state.editingIndex!=null : hasText)
    : (state.editingIndex!=null);
  const btn=document.getElementById(state.startBtnId);
  if(!btn)return;
  if(state.mode==='ai'){
    btn.style.display=enabled?'inline-block':'none';
  } else {
    btn.disabled=!enabled;
  }
}

taskInput.addEventListener('input',()=>{
  const l=taskInput.value.trim().length;
  document.getElementById('charCount').textContent=l+' 字';
  if(planState.tasks.length===0 && taskInput.value.trim().length>0){
    // 0条时打下第一个字：就地创建第0条并进入编辑状态，效果等同于自动替用户点了一次「手动加一条」——
    // 这样"打字直接开始"和"先手动加一条再打字"从第一个字起就是同一套状态，不再有谁多一步的区别
    planState.tasks.push(taskInput.value);
    planState.taskIndex=0;
    planState.editingIndex=0;
    renderTaskList(planState);
  } else if(planState.editingIndex!=null && planState.editingIndex<planState.tasks.length){
    // 有选中某一条时，改字实时同步回列表对应条目（跟【人】一致）；没选中就是纯自由输入（1条时允许，跟已有任务并存）
    planState.tasks[planState.editingIndex]=taskInput.value;
    renderTaskList(planState);
  }
  updateStartBtnState(planState);
});

function showPhase(id){document.querySelectorAll('.phase').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startSession(){
  currentTask=taskInput.value.trim();if(!currentTask)return;
  // 只有真的是【我】这边发起的开始，才归入 planTasks；【人】走 startSessionFromAI 间接调用这里，
  // 那边已经自己维护 aiState，不需要也不应该在这里重复处理
  if(currentTab==='plan'){
    if(planState.editingIndex!=null && planState.editingIndex<planState.tasks.length){
      planState.taskIndex=planState.editingIndex;
      planState.runningIndex=planState.editingIndex;
      planState.tasks[planState.editingIndex]=currentTask;
    } else {
      planState.tasks.push(currentTask);
      planState.taskIndex=planState.tasks.length-1;
      planState.runningIndex=planState.tasks.length-1;
    }
    renderTaskList(planState);
  }
  sessionCount++;timeLeft=DURATION;isPaused=false;
  deadlineTs=Date.now()+DURATION*1000; // 方案一：记录目标结束时间戳
  pausedTimeLeft=null;
  timerMode='down';overtimeBaseSec=0;overtimeSegStart=null;currentBlocks=1;
  isResting=false;segments=[];segBaseSec=0;segStart=Date.now();
  document.getElementById('restingNote').style.display='none';
  document.getElementById('restToggleBtn').textContent='休息 ☕';
  document.getElementById('restToggleBtn').style.display='';
  clearInterval(bufferInterval);
  document.getElementById('overtimeBuffer').style.display='none';
  document.getElementById('earlyBtn').style.display='';
  document.getElementById('overtimeStopBtn').style.display='none';
  document.getElementById('pauseBtn').style.display='';
  document.getElementById('timerSubLabel').textContent='剩余';
  sessionStartTime=document.getElementById('startTimeInput').value;
  updateEndTime('plan');
  document.getElementById('timerTaskLabel').textContent=currentTask;
  document.getElementById('timerEndLabel').textContent=sessionEndTime||'—';
  updateTimerDisplay();updateRing();updateSessionDots();
  showPhase('phaseTimer');
  document.getElementById('pauseBtn').textContent='暂停';
  clearInterval(timerInterval);
  timerInterval=setInterval(tick,1000);
}

// ── 分段计时：把"自然流逝的这一段"按当前显示名落一笔，再切换到新名字 ──
function currentSegElapsedSec(){
  return segBaseSec+(isPaused?0:(Date.now()-segStart)/1000);
}
function flushSegment(){
  const sec=currentSegElapsedSec();
  const mins=sec/60;
  if(mins>0.0167){ // 至少 1 秒，避免 0 分钟噪音段
    const name=isResting?'休息':currentTask;
    const last=segments[segments.length-1];
    if(last&&last.name===name)last.mins+=mins;
    else segments.push({name,mins});
  }
  segBaseSec=0;segStart=Date.now();
}
function toggleRest(){
  if(timerMode!=='down')return; // 正计时阶段不提供休息入口
  flushSegment();
  isResting=!isResting;
  document.getElementById('restToggleBtn').textContent=isResting?'结束休息':'休息 ☕';
  document.getElementById('restingNote').style.display=isResting?'block':'none';
  document.getElementById('timerCardLabel').textContent=isResting?'休息中':'本轮目标';
}

function tick(){
  if(isPaused)return;
  if(timerMode==='down'){
    // 方案一：每次都从时间戳差值算剩余，后台节流也能回来自动追上
    timeLeft=Math.max(0,Math.round((deadlineTs-Date.now())/1000));
    updateTimerDisplay();updateRing();
    if(timeLeft<=0){clearInterval(timerInterval);enterBuffer();}
  } else if(timerMode==='up'){
    updateTimerDisplay();updateOvertimeRing();
  }
}

// ── 倒计时归零：8 秒缓冲，什么都不点则自动转正计时 ──
function enterBuffer(){
  flushSegment(); // 把走到归零这一刻的分段（任务或休息）落一笔
  timerMode='buffer';bufferLeft=8;
  document.getElementById('pauseBtn').style.display='none';
  document.getElementById('earlyBtn').style.display='none';
  document.getElementById('overtimeStopBtn').style.display='none';
  document.getElementById('restToggleBtn').style.display='none'; // 正计时阶段不提供休息入口
  document.getElementById('timerSubLabel').textContent='已到时';
  document.getElementById('timerText').textContent='00:00';
  updateRing();
  const banner=document.getElementById('overtimeBuffer');
  banner.style.display='block';
  document.getElementById('bufferCountdown').textContent=bufferLeft;
  clearInterval(bufferInterval);
  bufferInterval=setInterval(()=>{
    bufferLeft--;
    document.getElementById('bufferCountdown').textContent=Math.max(0,bufferLeft);
    if(bufferLeft<=0){clearInterval(bufferInterval);enterOvertime();}
  },1000);
}

// 缓冲期内点「结束本轮」：按整 30 分钟结算
function endRoundFromBuffer(){
  clearInterval(bufferInterval);clearInterval(timerInterval);
  document.getElementById('overtimeBuffer').style.display='none';
  currentBlocks=1;
  sessionEndTime=nowHM(); // 用真实点击时刻覆盖开始阶段预算好的计划结束时间
  goToFeedback('normal');
}

// 进入正计时（继续累计归零那一刻正在显示的名字：任务或休息）
function enterOvertime(){
  timerMode='up';isPaused=false;
  overtimeBaseSec=0;overtimeSegStart=Date.now();
  segBaseSec=0;segStart=Date.now(); // 分段时钟跟正计时同步重新起算
  document.getElementById('overtimeBuffer').style.display='none';
  document.getElementById('pauseBtn').style.display='';
  document.getElementById('pauseBtn').textContent='暂停';
  document.getElementById('earlyBtn').style.display='none';
  document.getElementById('overtimeStopBtn').style.display='';
  document.getElementById('timerSubLabel').textContent='继续计时';
  clearInterval(timerInterval);
  timerInterval=setInterval(tick,1000);
  updateTimerDisplay();updateOvertimeRing();
}

function overtimeSec(){
  return overtimeBaseSec+(isPaused?0:(Date.now()-overtimeSegStart)/1000);
}

// 正计时阶段点「时间到」：结算，总时长 = 30 + 正计时
function stopOvertime(){
  flushSegment(); // 把正计时这一段也按当前名字（任务或休息）落一笔
  clearInterval(timerInterval);
  const total=DURATION+overtimeSec();
  currentBlocks=total/DURATION; // 30分=1块，零头按比例
  sessionEndTime=nowHM(); // 用真实点击时刻覆盖开始阶段预算好的计划结束时间，超时多久都按实际时刻算
  goToFeedback('normal');
}

function togglePause(){
  isPaused=!isPaused;
  if(timerMode==='up'){
    if(isPaused){
      overtimeBaseSec+=(Date.now()-overtimeSegStart)/1000;
    } else {
      overtimeSegStart=Date.now();
    }
  } else {
    if(isPaused){
      // 暂停：保存当前剩余秒数
      pausedTimeLeft=Math.max(0,Math.round((deadlineTs-Date.now())/1000));
    } else {
      // 继续：用剩余秒数重新算 deadline，相当于把终点往后推
      deadlineTs=Date.now()+pausedTimeLeft*1000;
      pausedTimeLeft=null;
    }
  }
  // 分段计时同步暂停/继续（暂停时间不计入任何分段）
  if(isPaused){segBaseSec+=(Date.now()-segStart)/1000;}
  else{segStart=Date.now();}
  document.getElementById('pauseBtn').textContent=isPaused?'继续':'暂停';
}

function goToFeedback(ctx){
  feedbackContext=ctx||'normal';
  document.getElementById('feedbackTaskLabel').textContent=currentTask;
  // 'normal' 显示「全部完成」；提前结束-未完成 只显示进度条
  document.getElementById('doneBtnWrap').style.display=feedbackContext==='normal'?'block':'none';
  showPhase('phaseFeedback');
}

function earlyFinish(){
  flushSegment(); // 提前结束：把走到这一刻的分段（任务或休息）落一笔
  clearInterval(timerInterval);clearInterval(bufferInterval);
  // 自动捕获当前时刻作为结束时间，不再手填
  const n=new Date();
  earlyEndTime=fmt(n.getHours())+':'+fmt(n.getMinutes());
  document.getElementById('earlyTaskLabel').textContent=currentTask;
  earlyChoice=null;
  ['choiceNext','choiceDone','choicePartial'].forEach(id=>document.getElementById(id).classList.remove('selected'));
  document.getElementById('earlyConfirmBtn').disabled=true;
  // 「下一个任务」与「完成！」在我有计划下逻辑相同，统一只留「完成！」；两个模式按钮文案一致
  document.getElementById('choiceNext').style.display='none';
  document.getElementById('choiceDoneLabel').textContent='完成！';
  showPhase('phaseEarly');
}

function selectChoice(c){
  earlyChoice=c;
  ['next','done','partial'].forEach(v=>{
    const el=document.getElementById('choice'+v.charAt(0).toUpperCase()+v.slice(1));
    if(el)el.classList.toggle('selected',c===v);
  });
  document.getElementById('earlyConfirmBtn').disabled=false;
}

// 把本轮已切出的分段（segments）按"任务名合并一条 + 休息合并一条"写入 history。
// pct/done 仅用于任务那一条；休息那一条永远不需要完成度。
function commitSegments(pct,done,endTime){
  let taskMins=0,restMins=0;
  segments.forEach(s=>{
    if(s.name==='休息')restMins+=s.mins;else taskMins+=s.mins;
  });
  if(taskMins>0.0167){
    history.push({task:currentTask,pct,done,session:sessionCount,startTime:sessionStartTime,endTime,early:true,blocks:taskMins/30,mins:Math.round(taskMins)});
  }
  if(restMins>0.0167){
    history.push({task:'休息',pct:100,done:true,session:sessionCount,startTime:sessionStartTime,endTime,early:true,isRest:true,blocks:restMins/30,mins:Math.round(restMins)});
  }
}

function confirmEarlyChoice(){
  const state=currentTab==='ai'?aiState:planState;

  if(earlyChoice==='partial'){
    // 进进度条页（无「完成！」按钮）；记录在进度确认时写入
    goToFeedback(currentTab==='ai'?'earlyAI':'earlyPlan');
    return;
  }

  // 'done'：任务段算 100% 完成，休息段单独成行
  commitSegments(100,true,earlyEndTime);
  lastUnfinishedTask=null;
  markComplete(state);
  returnToSetup(currentTab,earlyEndTime,true);
}

// ── 收尾回到设置页：【我】【人】共用一个函数，mode 决定操作哪一套 state ──
// newStart: 新的开始时间（回填两个输入框）
// autoNext: 完成后如果列表里还有别的待办，自动选中下一条（用户仍可随时手动点选别的覆盖掉）
// refillIdx/refillText: 未完成时，把这条任务（按下标，或兜底用纯文本）重新带回来，标题右侧那个横幅
//   （只有【我】有）会在这种情况下显示
function returnToSetup(mode,newStart,autoNext,refillIdx,refillText){
  const state=mode==='ai'?aiState:planState;
  if(newStart){
    document.getElementById('startTimeInput').value=newStart;
    document.getElementById('startTimeInputAI').value=newStart;
  }
  updateEndTime('plan');updateEndTime('ai');

  // 【人】这一轮如果脏写过共享的 taskInput（走 startSessionFromAI 时会写进去），
  // 收尾时要清掉，避免文字串台到【我】的框里；【我】自己这条路不会脏写 aiGoalInput，不需要对称处理
  if(mode==='ai'){
    taskInput.value='';
    document.getElementById('charCount').textContent='0 字';
  }
  document.getElementById('carryNotice').style.display='none'; // 默认先收起，只有下面「未完成回填」分支会重新打开

  document.getElementById('progressSlider').value=50;
  document.getElementById('sliderPct').textContent='50%';

  state.editingIndex=null;
  const inputEl=document.getElementById(state.inputId);

  if(refillIdx!=null&&refillIdx>=0&&refillIdx<state.tasks.length){
    // 未完成：把该任务回填，可继续或改选；标「进行中」由调用方负责
    state.taskIndex=refillIdx;
    state.editingIndex=refillIdx;
    inputEl.value=state.tasks[refillIdx];
    if(mode==='plan'){
      document.getElementById('charCount').textContent=state.tasks[refillIdx].length+' 字';
      document.getElementById('carryNotice').style.display='flex';
    }
  } else if(refillText){
    // 兜底：未完成但没有有效下标可用（理论上现在两边都走列表下标，这条基本不会触发）
    state.taskIndex=-1;
    inputEl.value=refillText;
    if(mode==='plan'){
      document.getElementById('charCount').textContent=refillText.length+' 字';
      document.getElementById('carryNotice').style.display='flex';
    }
  } else if(autoNext){
    const j=nextPendingIndex(state,state.runningIndex);
    if(j>=0){
      state.taskIndex=j;
      state.editingIndex=j; // 自动填充并可编辑（改字同步列表），用户也可以随时手动点列表里别的任务覆盖掉
      inputEl.value=state.tasks[j];
      if(mode==='plan')document.getElementById('charCount').textContent=state.tasks[j].length+' 字';
    } else {
      state.taskIndex=-1;
      inputEl.value='';
      if(mode==='plan')document.getElementById('charCount').textContent='0 字';
    }
  } else {
    state.taskIndex=-1; // 不预选，等用户自己挑或自己打字
    inputEl.value='';
    if(mode==='plan')document.getElementById('charCount').textContent='0 字';
  }

  updateStartBtnState(state);
  renderTaskList(planState);
  renderTaskList(aiState);
  renderHistory();
  if(currentTab!==mode)switchTab(mode);
  showPhase('phaseSetup');
  if(mode==='plan'){
    taskInput.focus();
    taskInput.setSelectionRange(taskInput.value.length,taskInput.value.length);
  }
}

// 找下一条「未完成」的任务下标：先从 after 之后找，找不到再从头找
function nextPendingIndex(state,after){
  const n=state.tasks.length;
  if(n===0)return -1;
  for(let k=1;k<=n;k++){
    const i=((after==null?-1:after)+k)%n;
    if(!state.completed.has(i))return i;
  }
  return -1;
}

// 把当前运行的任务标记为完成（删除线），移出进行中——【我】【人】共用
function markComplete(state){
  if(state.runningIndex!=null){
    state.completed.add(state.runningIndex);
    state.inProgress.delete(state.runningIndex);
    renderTaskList(state);
  }
}
// 把当前运行的任务标记为进行中（未完成，可多个并存）——【我】【人】共用
function markInProgress(state){
  if(state.runningIndex!=null&&!state.completed.has(state.runningIndex)){
    state.inProgress.add(state.runningIndex);
    renderTaskList(state);
  }
}

function timeDiffMins(fromStr,toStr){
  const[fh,fm]=fromStr.split(':').map(Number);
  const[th,tm]=toStr.split(':').map(Number);
  let diff=(th*60+tm)-(fh*60+fm);
  if(diff<0)diff+=24*60;
  return diff;
}

function makeVisBlock(BW,BH,BR,fillAmt,isRed){
  const stroke=isRed?'#7a1e1e':'#aaa';
  const hatch=isRed?'url(#vis-hr)':'url(#vis-hg)';
  const sw=isRed?1.5:1;
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  const isHalf=fillAmt>0&&fillAmt<1;
  const isEmpty=fillAmt===0;
  const W=isHalf?Math.max(8,Math.round(BW*fillAmt+4)):BW;
  svg.setAttribute('width',W);svg.setAttribute('height',BH);
  svg.style.cssText='display:block;flex-shrink:0';
  if(!isEmpty){
    const clipId='vc'+Math.random().toString(36).slice(2,7);
    const defs=document.createElementNS(ns,'defs');
    const cp=document.createElementNS(ns,'clipPath');
    cp.setAttribute('id',clipId);
    const cr=document.createElementNS(ns,'rect');
    cr.setAttribute('x','1');cr.setAttribute('y','1');
    cr.setAttribute('width',W-2);cr.setAttribute('height',BH-2);
    cp.appendChild(cr);defs.appendChild(cp);svg.appendChild(defs);
    const fr=document.createElementNS(ns,'rect');
    fr.setAttribute('x','1');fr.setAttribute('y','1');
    fr.setAttribute('width',W-2);fr.setAttribute('height',BH-2);
    fr.setAttribute('rx',BR);fr.setAttribute('fill',hatch);
    fr.setAttribute('clip-path','url(#'+clipId+')');
    svg.appendChild(fr);
  }
  const border=document.createElementNS(ns,'rect');
  border.setAttribute('x','1');border.setAttribute('y','1');
  border.setAttribute('width',W-2);border.setAttribute('height',BH-2);
  border.setAttribute('rx',BR);border.setAttribute('fill','none');
  border.setAttribute('stroke',stroke);border.setAttribute('stroke-width',sw);
  border.setAttribute('stroke-dasharray','4 3');
  svg.appendChild(border);
  return svg;
}

function renderHistory(){
  const sec=document.getElementById('historySection');
  const list=document.getElementById('historyList');
  if(history.length===0){sec.style.display='none';return;}
  sec.style.display='block';
  const done=history.filter(h=>h.done).length;
  document.getElementById('histSummary').textContent=done+' 完成 / '+history.length+' 轮 · 专注约 '+totalFocusMins()+' 分钟';

  // 按任务名全局合并（不要求相邻），保留首次出现顺序
  const evtMap=new Map();
  const evts=[];
  history.forEach(item=>{
    const b=item.blocks!=null?item.blocks:(item.early?0.5:1);
    const name=item.task.trim();
    let ev=evtMap.get(name);
    if(ev){
      ev.endTime=item.endTime||ev.endTime;
      ev.blocks+=b;
      ev.allDone=ev.allDone&&item.done;
      ev.early=ev.early||(item.early||false);
      ev.lastPct=item.done?100:item.pct;
    } else {
      ev={
        name,
        startTime:item.startTime||'',
        endTime:item.endTime||'',
        blocks:b,
        allDone:item.done,
        early:item.early||false,
        lastPct:item.done?100:item.pct,
      };
      evtMap.set(name,ev);
      evts.push(ev);
    }
  });

  const maxBlocks=Math.max(...evts.map(e=>e.blocks));
  const BW=36,BH=32,BR=3;

  list.innerHTML='';
  // 倒序显示（最新在上）
  evts.slice().reverse().forEach(ev=>{
    const isLongest=ev.blocks===maxBlocks;
    const row=document.createElement('div');
    row.className='vis-event-row';

    const nameEl=document.createElement('div');
    nameEl.className='vis-event-name'+(isLongest?' vis-hl':'');
    nameEl.textContent=ev.name;
    row.appendChild(nameEl);

    const blocksEl=document.createElement('div');
    blocksEl.className='vis-blocks';
    // 每一行只画自己实际有多少格，不再被最长的那一行撑长、不再补空格
    let rem=ev.blocks;
    const ownCols=Math.ceil(rem-1e-9); // 极小容差避免浮点误差多算一格
    for(let i=0;i<ownCols;i++){
      const amt=rem>=1?1:rem>0?rem:0;
      blocksEl.appendChild(makeVisBlock(BW,BH,BR,amt,isLongest));
      rem=Math.max(0,rem-1);
    }
    row.appendChild(blocksEl);
    list.appendChild(row);
  });
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── 导出：合并同名跨轮任务为事件 ──
function buildEvents(){
  const eventMap=new Map();
  const events=[];
  history.forEach(item=>{
    const b=item.blocks!=null?item.blocks:(item.early?(item.earlyFill||0.5):1);
    const name=item.task.trim();
    let ev=eventMap.get(name);
    if(ev){
      // 同名任务：全局合并（不要求相邻）
      ev.endTime=item.endTime||ev.endTime;
      ev.sessions.push(item);
      ev.totalPct=(ev.totalPct||100)+( item.done?100:item.pct );
      ev.allDone=ev.allDone&&item.done;
      ev.anyEarly=ev.anyEarly||(item.early||false);
      ev.blocks+=b;
    } else {
      ev={
        name,
        startTime: item.startTime||'',
        endTime: item.endTime||'',
        sessions:[item],
        allDone: item.done,
        anyEarly: item.early||false,
        blocks: b,
      };
      eventMap.set(name,ev);
      events.push(ev);
    }
  });
  return events;
}

function todayStr(){
  const d=new Date();
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}

// 真实专注分钟总和（含超时、含提前结束的实际时长）；旧记录无 mins 时回退
function totalFocusMins(){
  return Math.round(history.reduce((s,it)=>{
    let m=it.mins;
    if(m==null)m=it.blocks!=null?it.blocks*30:(it.early?15:30);
    return s+m;
  },0));
}

function statusLabel(ev){
  if(ev.sessions.length===1){
    const s=ev.sessions[0];
    if(s.done&&s.early) return '提前完成';
    if(s.done) return '✓ 完成';
    return s.pct+'%';
  }
  // 跨轮
  const last=ev.sessions[ev.sessions.length-1];
  const first=ev.sessions[0];
  if(!first.done){
    if(last.done) return first.pct+'%→✓';
    return first.pct+'%→'+last.pct+'%';
  }
  return '✓ 完成';
}

function timeRange(ev){
  const start=ev.sessions[0].startTime||'';
  const end=ev.endTime||ev.sessions[ev.sessions.length-1].endTime||'';
  if(!start&&!end) return '';
  if(!start) return '→'+end;
  if(!end) return start+'→';
  return start+'–'+end;
}

function downloadHTML(html, filename){
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// ── 拖拽排序：用 Pointer Events 统一实现，鼠标/触屏共用一套逻辑，【我】【人】共用 ──
// （原生 HTML5 拖放规范上就是给鼠标设计的，触屏基本不触发；Pointer Events 才是
//   跨设备拖拽排序的标准做法，桌面和手机行为一致）
let aiDragState=null; // {state, idx, el, pointerId, startX, startY, moved, overIdx}
const AI_DRAG_THRESHOLD=6; // 移动超过这个像素数才算「开始拖」，否则算普通点击

document.addEventListener('pointermove',e=>{
  if(!aiDragState)return;
  const st=aiDragState;
  const dx=e.clientX-st.startX,dy=e.clientY-st.startY;
  if(!st.moved){
    if(Math.hypot(dx,dy)<AI_DRAG_THRESHOLD)return; // 还没达到「算拖拽」的移动量，先什么都不做
    st.moved=true;
    try{st.el.setPointerCapture(st.pointerId);}catch(err){}
    st.el.style.position='relative';
    st.el.style.zIndex='10';
    st.el.style.boxShadow='0 4px 14px rgba(0,0,0,.18)';
    st.el.style.background='var(--bg)';
    st.el.style.cursor='grabbing';
  }
  e.preventDefault();
  st.el.style.transform='translateY('+dy+'px)';
  // 找出当前指针悬停在哪一行上方，用来实时预览「松手会插到这里」
  const rows=[...document.getElementById(st.state.listId).children].filter(el=>el.dataset&&el.dataset.taskIdx!=null);
  let overIdx=null;
  for(const row of rows){
    if(row===st.el)continue;
    const r=row.getBoundingClientRect();
    if(e.clientY>=r.top&&e.clientY<=r.bottom){overIdx=Number(row.dataset.taskIdx);break;}
  }
  rows.forEach(r=>{if(r!==st.el)r.style.borderTopColor='transparent';});
  if(overIdx!=null){
    const row=rows.find(r=>Number(r.dataset.taskIdx)===overIdx);
    if(row)row.style.borderTopColor='var(--text)';
  }
  st.overIdx=overIdx;
});

function endAIDrag(){
  if(!aiDragState)return;
  const st=aiDragState;
  try{st.el.releasePointerCapture(st.pointerId);}catch(err){}
  aiDragState=null;
  if(st.moved&&st.overIdx!=null&&st.overIdx!==st.idx){
    moveTask(st.state,st.idx,st.overIdx); // 内部会重新渲染，顺带清掉所有拖拽期间加的行内样式
  } else if(st.moved){
    renderTaskList(st.state); // 拖了但没落在别的行上（比如拖出列表外松手）：还原视觉，顺序不变
  } else {
    selectTask(st.state,st.idx); // 没达到拖拽阈值：当成一次普通点击，选中该任务
  }
}
document.addEventListener('pointerup',endAIDrag);
document.addEventListener('pointercancel',endAIDrag);

function renderTaskList(state){
  const list=document.getElementById(state.listId);

    // 按下：先只记状态，不立刻判定是点击还是拖拽，等真的移动一段距离再算「开始拖」
    div.addEventListener('pointerdown',e=>{
      if(e.button!=null&&e.button!==0)return;    // 只响应主按键/单指
      if(e.target.closest('button'))return;       // 点在删除按钮上不算拖拽起手
      aiDragState={state,idx:i,el:div,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false,overIdx:null};
    });

    const idx=document.createElement('span');
    idx.style.cssText='font-size:11px;color:var(--text3);flex-shrink:0;width:16px;text-align:right';
    idx.textContent=(i+1)+'.';
    const txt=document.createElement('span');
    txt.style.cssText='font-size:13px;flex:1;line-height:1.5;'+(done?'text-decoration:line-through;color:var(--text3)':selected?'color:var(--text);font-weight:500':'color:var(--text2)');
    txt.textContent=t||'（空白，点击输入内容）';

    if(inProg){

    const delBtn=document.createElement('button');

    delBtn.style.cssText='background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;flex-shrink:0;display:flex;align-items:center;border-radius:6px;transition:color .12s,background .12s';
    delBtn.onmouseover=()=>{delBtn.style.color='var(--red-text)';delBtn.style.background='var(--red-bg)';};
    delBtn.onmouseout=()=>{delBtn.style.color='var(--text3)';delBtn.style.background='';};
    delBtn.onclick=e=>{e.stopPropagation();askDeleteTask(state,i);};
    div.appendChild(delBtn);
    list.appendChild(div);
  });

  // 手动新增一条：跟【人】下面 footer 里「有别的任务要拆」（重新调用AI）刻意区分开——
  // 这里放在列表内部、虚线分隔、不同图标和文案，点了不调用AI，直接本地加一条空白任务
  const addRow=document.createElement('div');
  addRow.onclick=()=>addManualTask(state);
  addRow.style.cssText='display:flex;align-items:center;gap:6px;padding:8px 12px;cursor:pointer;color:var(--text3);font-size:12px;border-top:1px dashed var(--border);margin-top:2px;transition:color .12s';
  addRow.onmouseover=()=>{addRow.style.color='var(--text2)';};
  addRow.onmouseout=()=>{addRow.style.color='var(--text3)';};
  addRow.innerHTML='<i class="ti ti-square-plus" style="font-size:14px"></i>手动加一条';
  list.appendChild(addRow);

  // 面板要不要露出来，两边规则不一样：
  // 【人】0条时隐藏——本来就得先靠AI拆出东西才有列表可言，没有"用户已经有清单只是没打字"这种情况
  // 【我】哪怕0条也常驻显示——不然"手动加一条"这个唯一能从0条起步、不用打字就开始计时的入口会被连带藏起来
  document.getElementById(state.panelId).style.display=(state.mode==='plan'||state.tasks.length)?'block':'none';

// ── 删除任务：先弹确认，确认后再真正删，并把 completed / inProgress /
// taskIndex / editingIndex / runningIndex 这些「按下标记录状态」的地方
// 全部跟着往前挪一位，避免删了中间一条之后状态张冠李戴——【我】【人】共用一套 ──
let pendingDelete=null; // {state, idx}
function askDeleteTask(state,i){
  pendingDelete={state,idx:i};
  document.getElementById('deleteTaskText').textContent=state.tasks[i]||'（空白任务）';
  document.getElementById('deleteTaskModal').classList.add('show');
}
function closeDeleteTask(){
  pendingDelete=null;
  document.getElementById('deleteTaskModal').classList.remove('show');
}
function remapIndexAfterRemove(v,removedIdx){
  if(v==null)return v;
  if(v===removedIdx)return null;
  return v>removedIdx?v-1:v;
}
function remapSetAfterRemove(set,removedIdx){
  const ns=new Set();
  set.forEach(idx=>{if(idx!==removedIdx)ns.add(idx>removedIdx?idx-1:idx);});
  return ns;
}
function confirmDeleteTask(){
  if(!pendingDelete)return;
  const{state,idx:i}=pendingDelete;
  state.tasks.splice(i,1);
  state.completed=remapSetAfterRemove(state.completed,i);
  state.inProgress=remapSetAfterRemove(state.inProgress,i);
  state.taskIndex=remapIndexAfterRemove(state.taskIndex,i);
  state.editingIndex=remapIndexAfterRemove(state.editingIndex,i);
  state.runningIndex=remapIndexAfterRemove(state.runningIndex,i);
  if(state.editingIndex==null){
    document.getElementById(state.inputId).value='';
    if(state.mode==='plan')document.getElementById('charCount').textContent='0 字';
  }
  closeDeleteTask();
  renderTaskList(state);
  updateStartBtnState(state);
}

// ── 拖拽排序：同样要把状态下标跟着挪过去 ──
function remapIndexAfterMove(v,from,to){
  if(v==null)return v;
  if(v===from)return to;
  if(from<to&&v>from&&v<=to)return v-1;
  if(from>to&&v>=to&&v<from)return v+1;
  return v;
}
function remapSetAfterMove(set,from,to){
  const ns=new Set();
  set.forEach(idx=>ns.add(remapIndexAfterMove(idx,from,to)));
  return ns;
}
function moveTask(state,from,to){
  if(from===to)return;
  const item=state.tasks.splice(from,1)[0];
  state.tasks.splice(to,0,item);
  state.completed=remapSetAfterMove(state.completed,from,to);
  state.inProgress=remapSetAfterMove(state.inProgress,from,to);
  state.taskIndex=remapIndexAfterMove(state.taskIndex,from,to);
  state.editingIndex=remapIndexAfterMove(state.editingIndex,from,to);
  state.runningIndex=remapIndexAfterMove(state.runningIndex,from,to);
  renderTaskList(state);
}

// ── 手动新增一条空白任务：不调用AI，直接加进列表末尾并选中，等用户在上方输入框打字 ──
function addManualTask(state){

function selectTask(state,i){

  document.getElementById(state.inputId).value=text;

}

const AI_SYSTEM_PROMPT=`你是一个专注任务拆解助手。用户告诉你今天想做什么，你帮他们拆解成若干个30分钟的具体任务。

## 你的工作流程

- 定理证明：证明什么定理？已经推到哪一步了？
- 代码：什么语言？实现什么功能？
- 读文献：读什么主题？目标是泛读还是精读做笔记？

## 拆解原则

绝对不要输出QUESTION和TASKS以外的任何内容，不要解释，不要寒暄，不要"好的"、"明白了"之类的开场白。`;

async function askAI(){
  const input=document.getElementById('aiGoalInput').value.trim();
  if(!input)return;
  aiState.editingIndex=null; // 点「让AI来拆」即把输入当作新指令，退出编辑某条的状态

  const btn=document.getElementById('aiAskBtn');
  btn.disabled=true;btn.textContent='AI思考中…';
  document.getElementById('aiStatus').textContent='';

  // 把用户输入加入对话历史
  aiConversation.push({role:'user',content:input});

  try{
    const res=await fetch(AI_PROXY_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        messages:[
          {role:'system',content:AI_SYSTEM_PROMPT},
          ...aiConversation
        ]
      })
    });
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      if(res.status===401||res.status===403) document.getElementById('aiStatus').textContent='AI 服务暂不可用，请联系工具作者';
      else document.getElementById('aiStatus').textContent='请求失败：'+(err.error?.message||res.status);
      aiConversation.pop(); // 失败时回滚
      btn.disabled=false;btn.textContent='让AI来拆 ✦';return;
    }
    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content?.trim()||'';

    // 把AI回复加入对话历史
    aiConversation.push({role:'assistant',content:reply});

    if(reply.startsWith('QUESTION:')){
      // AI需要追问
      const question=reply.replace('QUESTION:','').trim();
      document.getElementById('aiGoalInput').value='';
      document.getElementById('aiGoalInput').placeholder=question;
      document.getElementById('aiStatus').textContent='↑ '+question;
      document.getElementById('aiGoalInput').focus();
    } else if(reply.startsWith('TASKS:')){
      // AI给出任务列表
      const lines=reply.replace('TASKS:','').trim().split('\n').map(l=>l.trim()).filter(l=>l);
      const tasks=lines.map(l=>l.replace(/^\d+[\.、。\)）]\s*/,'').trim()).filter(l=>l.length>0);
      if(!tasks.length){
        document.getElementById('aiStatus').textContent='AI没有返回有效任务，请重试';
        btn.disabled=false;btn.textContent='让AI来拆 ✦';return;
      }
      applyParsedTasks(tasks);
      // 重置输入框placeholder
      document.getElementById('aiGoalInput').placeholder='今天想做什么？随便说，AI来拆。\n例：「我要写工作报告」或「昨天写到引言第二段，今天接着写」';
      document.getElementById('aiStatus').textContent='';
    } else {
      // 兜底：尝试直接解析
      const lines=reply.split('\n').map(l=>l.trim()).filter(l=>l);
      const tasks=lines.map(l=>l.replace(/^\d+[\.、。\)）]\s*/,'').trim()).filter(l=>l.length>0);
      if(tasks.length){
        applyParsedTasks(tasks);
        document.getElementById('aiGoalInput').placeholder='今天想做什么？随便说，AI来拆。\n例：「我要写工作报告」或「昨天写到引言第二段，今天接着写」';
      } else {
        document.getElementById('aiStatus').textContent='格式异常，请重试';
      }
    }
  }catch(e){
    document.getElementById('aiStatus').textContent='网络错误，请检查连接';
    aiConversation.pop();
  }
  btn.disabled=false;btn.textContent='让AI来拆 ✦';
}

// 应用拆解结果：追加模式接在末尾并保留状态，否则替换并重置
function applyParsedTasks(tasks){
  if(appendMode){
    const base=aiState.tasks.length;
    aiState.tasks=aiState.tasks.concat(tasks);
    aiState.taskIndex=base;                 // 选中第一条新任务
    aiState.editingIndex=base;              // 视为"已从列表选中"，可直接开始
    appendMode=false;
  } else {
    aiState.tasks=tasks;
    aiState.taskIndex=0;
    aiState.completed=new Set();
    aiState.inProgress=new Set();
    aiState.editingIndex=0;
  }
  renderTaskList(aiState);
  showAICurrentTask(aiState.tasks[aiState.taskIndex]);
  updateStartBtnState(aiState);
}

        <div style="width:130px;min-height:44px;border:1.5px dashed var(--border2);border-radius:10px;display:flex;align-items:center;padding:8px 12px;font-size:11px;color:var(--text3)">今天想做什么？随便说</div>
      </div>
      <div class="ob-frame ob-frame-b">
        <div style="width:130px;min-height:44px;border:1.5px solid var(--border2);border-radius:10px;display:flex;align-items:center;padding:8px 12px;font-size:12px;color:var(--text)">我要写工作报告</div>
      </div>` },

    { icon:'ti-message-question', title:'信息不够会追问细节',
      anim:`
      <div class="ob-frame ob-frame-a">
        <div style="align-self:flex-end;padding:6px 12px;background:var(--bg2);border-radius:9px;font-size:11px;color:var(--text)">我要练运动</div>
      </div>
      <div class="ob-frame ob-frame-b">
        <div style="align-self:flex-end;padding:6px 12px;background:var(--bg2);border-radius:9px;font-size:11px;color:var(--text)">我要练运动</div>
        <div style="align-self:flex-start;padding:6px 12px;border:1.5px solid var(--border2);border-radius:9px;font-size:11px;color:var(--text2)">✦ 新手还是有基础？</div>
      </div>` },

    { icon:'ti-edit', title:'拆得不满意，打字改',
      anim:`
      <div class="ob-frame ob-frame-a">
        <span style="padding:5px 9px;background:var(--bg2);border-radius:7px;font-size:11px;color:var(--text)">① 深蹲训练</span>
      </div>
      <div class="ob-frame ob-frame-b">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="padding:5px 9px;border:1.5px solid var(--border2);border-radius:7px;font-size:11px;color:var(--text)">① 拉伸热身</span>
          <i class="ti ti-pencil" style="font-size:13px;color:var(--text3)"></i>
        </div>
      </div>` },

    { icon:'ti-coffee', title:'计时不停，来回切换',
      anim:`
      <div class="ob-frame ob-frame-a">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="22" fill="none" stroke="var(--border)" stroke-width="5"/>
          <circle cx="26" cy="26" r="22" fill="none" stroke="var(--text)" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="46" transform="rotate(-90 26 26)"/>
          <text x="26" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text)">18:24</text>
        </svg>
        <div style="display:flex;border:1px solid var(--border2);border-radius:99px;overflow:hidden;font-size:11px">
          <span style="padding:5px 13px;background:var(--text);color:var(--bg)">专注</span>
          <span style="padding:5px 13px;color:var(--text2)">休息</span>
        </div>
      </div>
      <div class="ob-frame ob-frame-b">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="22" fill="none" stroke="var(--border)" stroke-width="5"/>
          <circle cx="26" cy="26" r="22" fill="none" stroke="var(--blue-text)" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="58" transform="rotate(-90 26 26)"/>
          <text x="26" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text)">17:52</text>
        </svg>
        <div style="display:flex;border:1px solid var(--border2);border-radius:99px;overflow:hidden;font-size:11px">
          <span style="padding:5px 13px;color:var(--text2)">专注</span>
          <span style="padding:5px 13px;background:var(--blue-text);color:#fff">休息</span>
        </div>
      </div>` },

    { icon:'ti-flag-3', title:'提前结束，记录进度',
      anim:`
      <div class="ob-frame ob-frame-a">
        <div style="display:flex;gap:8px">
          <span style="padding:7px 12px;border:1.5px solid var(--border2);border-radius:8px;font-size:11px;color:var(--text2)">完成</span>
          <span style="padding:7px 12px;border:1.5px solid var(--border2);border-radius:8px;font-size:11px;color:var(--text2)">未完成</span>
        </div>
        <div style="width:130px;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden"></div>
      </div>
      <div class="ob-frame ob-frame-b">
        <div style="display:flex;gap:8px">
          <span style="padding:7px 12px;border:1.5px solid var(--border2);border-radius:8px;font-size:11px;color:var(--text2)">完成</span>
          <span style="padding:7px 12px;border:1.5px solid var(--text);background:var(--text);color:var(--bg);border-radius:8px;font-size:11px;font-weight:600">未完成</span>
        </div>
        <div style="width:130px;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden"><div style="width:60%;height:100%;background:var(--text)"></div></div>
      </div>` },

    { icon:'ti-chart-bar', title:'方块图复盘，一键导出',
      anim:`
      <div class="ob-frame ob-frame-a">
        <div style="display:flex;gap:4px">
          <div style="${dashedBlock}"></div><div style="${dashedBlock}"></div><div style="${dashedBlock}"></div>
        </div>
      </div>
      <div class="ob-frame ob-frame-b">
        <div style="display:flex;gap:4px;align-items:center">
          <div style="${filledBlock}"></div><div style="${filledBlock}"></div><div style="${filledBlock}"></div>
          <i class="ti ti-download" style="margin-left:6px;color:var(--text2);font-size:15px"></i>
        </div>
      </div>` },
  ];

  let obIndex=0;

  function renderOnboardStep(){
    const s=OB_STEPS[obIndex];
    document.getElementById('obIcon').innerHTML='<i class="ti '+s.icon+'"></i>';
    document.getElementById('obTitle').textContent=s.title;
    document.getElementById('obAnim').innerHTML=s.anim;
    const dots=document.getElementById('obDots');
    dots.innerHTML='';
    OB_STEPS.forEach((_,i)=>{
      const d=document.createElement('div');
      d.className='ob-dot'+(i<=obIndex?' on':'');
      dots.appendChild(d);
    });
    document.getElementById('obBackBtn').style.display=obIndex===0?'none':'';
    document.getElementById('obNextBtn').textContent=obIndex===OB_STEPS.length-1?'开始使用 →':'下一步 →';
  }

  window.obNext=function(){
    if(obIndex<OB_STEPS.length-1){obIndex++;renderOnboardStep();}
    else finishOnboarding();
  };
  window.obPrev=function(){
    if(obIndex>0){obIndex--;renderOnboardStep();}
  };
  window.skipOnboarding=finishOnboarding;
  function finishOnboarding(){
    document.getElementById('onboardOverlay').classList.remove('show');
    document.getElementById('obReplayBtn').style.display='flex';
    localStorage.setItem('ft_onboarded','1');
  }
  window.startOnboarding=function(){
    obIndex=0;
    renderOnboardStep();
    document.getElementById('onboardOverlay').classList.add('show');
  };

  if(!localStorage.getItem('ft_onboarded')){
    startOnboarding();
  } else {
    document.getElementById('obReplayBtn').style.display='flex';
  }
})();
</script>
</body>
</html>
