// 加子任务的行内输入：记录"正在哪个父节点下新增" {parentId} 或顶层 {parentId:null}
let addingChildFor=undefined; // undefined=没有；否则是父节点 id（null 代表顶层）

function renderTaskList(state){
  const list=document.getElementById(state.listId);
  if(!list)return;
  const lbl=state.panelLabelId?document.getElementById(state.panelLabelId):null;
  if(lbl)lbl.textContent='待办任务 '+countRemaining(state)+' 项';
  list.innerHTML='';

  // 〔手动加一条〕：放在「待办任务 N 项」和第一条任务之间；选中 ≥2 条时变灰不可点
  const addDisabled=selCount(state)>=2;
  const addRow=document.createElement('div');
  addRow.dataset.ui='add-row';
  addRow.title=addDisabled?'多选时不能手动加一条':(soleSel(state)!=null?'给选中的那条加子任务':'加一条任务');
  addRow.style.cssText='display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:12px;border-bottom:1px dashed var(--border);margin-bottom:2px;transition:color .12s;'+
    (addDisabled?'cursor:default;color:var(--border2)':'cursor:pointer;color:var(--text3)');
  if(!addDisabled){
    addRow.onclick=()=>addManualTask(state);
    addRow.onmouseover=()=>{addRow.style.color='var(--text2)';};
    addRow.onmouseout=()=>{addRow.style.color='var(--text3)';};
  }
  addRow.innerHTML='<i class="ti ti-square-plus" style="font-size:14px"></i>手动加一条';
  list.appendChild(addRow);

  state.tasks.forEach(node=>renderNodeRow(state,node,0,list));
  // 如果正在顶层加子任务，输入框放在最后
  if(addingChildFor===null)list.appendChild(buildAddInput(state,null,0));

  const panel=state.panelId?document.getElementById(state.panelId):null;
  if(panel)panel.style.display=(state.mode==='plan'||state.tasks.length)?'block':'none';
}

// 递归渲染一个节点行 + 它的子树
function renderNodeRow(state,node,depth,list){
  const done=nodeDone(node);
  const inProg=!done&&node.inProgress;
  const selected=isSel(state,node.id);
  const hasKids=node.children&&node.children.length>0;
  const div=document.createElement('div');
  div.dataset.nodeId=node.id;
  div.dataset.depth=depth;
  const padLeft=12+depth*20;
  div.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 12px 8px '+padLeft+'px;cursor:pointer;transition:background .12s;border-top:2px solid transparent;touch-action:none;user-select:none;'+(selected?'background:var(--bg3)':'');
  div.onmouseover=()=>{if(!selected&&!aiDragState)div.style.background='var(--bg2)';};
  div.onmouseout=()=>{if(!selected&&!aiDragState)div.style.background='';};
  div.addEventListener('pointerdown',e=>{
    if(e.button!=null&&e.button!==0)return;
    if(e.target.closest('button,input'))return;
    closeRowMenu();
    aiDragState={state,id:node.id,el:div,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false,overId:null,longFired:false,timer:null};
    // 只有确认框启用手势：框里没有对话框，改字只能就地进行
    if(state.gestures&&e.pointerType==='touch'){
      const st=aiDragState;
      st.timer=setTimeout(()=>{
        if(aiDragState!==st||st.moved)return;
        st.longFired=true;
        openRowMenu(state,node.id,st.startX,st.startY);
      },LONG_PRESS_MS);
    }
  });

  // 折叠箭头（有子任务才有；没有则占位对齐）
  const arrow=document.createElement('span');
  arrow.style.cssText='flex-shrink:0;width:14px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:12px';
  if(hasKids){
    arrow.style.cursor='pointer';
    arrow.innerHTML='<i class="ti ti-chevron-'+(node.collapsed?'right':'down')+'"></i>';
    arrow.title=node.collapsed?'展开子任务':'收起子任务';
    arrow.addEventListener('pointerdown',e=>{e.stopPropagation();}); // 别触发拖拽
    arrow.onclick=e=>{e.stopPropagation();node.collapsed=!node.collapsed;renderTaskList(state);};
  }
  div.appendChild(arrow);

  // 正在改这一条：整行换成行内小框框（双击/长按〔修改〕进来的）
  if(state.editingId===node.id){
    div.appendChild(buildInlineInput(state,node,depth));
    list.appendChild(div);
    if(hasKids&&!node.collapsed)node.children.forEach(c=>renderNodeRow(state,c,depth+1,list));
    if(addingChildFor===node.id)list.appendChild(buildAddInput(state,node.id,depth+1));
    return;
  }

  // 选中不再画空心圆：靠整行底色 + 文字加粗表示（单击选中、可多选）
  const txt=document.createElement('span');
  txt.style.cssText='font-size:13px;flex:1;line-height:1.5;'+(done?'text-decoration:line-through;color:var(--text3)':selected?'color:var(--text);font-weight:500':'color:var(--text2)');
  txt.textContent=node.text||'（空白，单击输入内容）';
  if(!node.text)txt.style.fontStyle='italic';
  div.appendChild(txt);

  if(inProg){
    const tag=document.createElement('span');
    tag.style.cssText='font-size:10px;color:var(--blue-text);background:var(--blue-bg);padding:2px 6px;border-radius:99px;flex-shrink:0';
    tag.textContent='进行中';
    div.appendChild(tag);
  }
  if(done&&nodeHasRealFeedback(node)){
    const fbBtn=document.createElement('button');
    fbBtn.className='fb-link';
    fbBtn.textContent='查看反馈';
    fbBtn.title='查看这条任务的反馈';
    fbBtn.onclick=e=>{e.stopPropagation();openFbDetail(state,node.id);};
    div.appendChild(fbBtn);
  }
  // 删除
  const delBtn=document.createElement('button');
  delBtn.innerHTML='<i class="ti ti-x" style="font-size:13px"></i>';
  delBtn.title='删除这条任务';
  delBtn.style.cssText='background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;flex-shrink:0;display:flex;align-items:center;border-radius:6px;transition:color .12s,background .12s';
  delBtn.onmouseover=()=>{delBtn.style.color='var(--red-text)';delBtn.style.background='var(--red-bg)';};
  delBtn.onmouseout=()=>{delBtn.style.color='var(--text3)';delBtn.style.background='';};
  delBtn.onclick=e=>{
    e.stopPropagation();
    if(state.instant){deleteNodeById(state,node.id);renderTaskList(state);}
    else askDeleteTask(state,node.id);
  };
  div.appendChild(delBtn);
  list.appendChild(div);

  // 子树（未折叠才渲染）
  if(hasKids&&!node.collapsed){
    node.children.forEach(c=>renderNodeRow(state,c,depth+1,list));
  }
  // 如果正在给这个节点加子任务，输入框接在它子树后面
  if(addingChildFor===node.id){
    list.appendChild(buildAddInput(state,node.id,depth+1));
  }
}

// 加子任务的行内输入框：打字 + 点空白即确认；空内容点空白=取消
function buildAddInput(state,parentId,depth){
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;align-items:center;gap:8px;padding:6px 12px 6px '+(12+depth*20)+'px';
  const inp=document.createElement('input');
  inp.type='text';
  inp.placeholder='输入子任务，点别处即确认';
  inp.style.cssText='flex:1;font-size:13px;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text)';
  let done=false;
  const commit=()=>{
    if(done)return;done=true;
    const text=inp.value.trim();
    addingChildFor=undefined;
    if(text){
      const node=newNode(text);
      if(parentId===null){state.tasks.push(node);}
      else{const p=findNode(state,parentId);if(p){if(!p.children)p.children=[];p.children.push(node);p.collapsed=false;}}
    }
    renderTaskList(state);
  };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    else if(e.key==='Escape'){done=true;addingChildFor=undefined;renderTaskList(state);}
  });
  wrap.appendChild(inp);
  setTimeout(()=>inp.focus(),0);
  return wrap;
}
function startAddChild(state,parentId){
  addingChildFor=parentId;
  const p=findNode(state,parentId);
  if(p)p.collapsed=false; // 展开好让新输入框可见
  renderTaskList(state);
}

// ── 删除任务：先弹确认，确认后再真正删，并把 completed / inProgress /
// taskIndex / editingIndex / runningIndex 这些「按下标记录状态」的地方
// 全部跟着往前挪一位，避免删了中间一条之后状态张冠李戴——【我】【人】共用一套 ──
let pendingDelete=null; // {state, id}
function askDeleteTask(state,id){
  pendingDelete={state,id};
  const node=findNode(state,id);
  document.getElementById('deleteTaskText').textContent=(node&&node.text)||'（空白任务）';
  document.getElementById('deleteTaskModal').classList.add('show');
}
function closeDeleteTask(){
  pendingDelete=null;
  document.getElementById('deleteTaskModal').classList.remove('show');
}
// 直接删掉一个节点（空白条没打字就点别处时用，不走确认框）
function deleteNodeById(state,id){
  const loc=findParentArray(state,id);
  if(loc)loc[0].splice(loc[1],1);
  setSel(state,state.selectedIds.filter(x=>x!==id));
  if(state.editingId===id)state.editingId=null;
  if(state.runningId===id)state.runningId=null;
}
// 节点模型：删除/移动都按 id，不再需要任何下标 remap（反馈/完成状态本就挂在节点上，跟着走）
function confirmDeleteTask(){
  if(!pendingDelete)return;
  const{state,id}=pendingDelete;
  const loc=findParentArray(state,id);
  if(loc){loc[0].splice(loc[1],1);} // 从它所在的数组里移除；子孙随节点一起消失
  setSel(state,state.selectedIds.filter(x=>x!==id));
  if(state.editingId===id){
    state.editingId=null;
    document.getElementById(state.inputId).value='';
    document.getElementById('charCount').textContent='0 字';
  }
  if(state.runningId===id)state.runningId=null;
  closeDeleteTask();
  renderTaskList(state);
  updateStartBtnState(state);
}

// 同层移动：fromId 和 toId 必须在同一个父数组里。落点语义 = 插到 to 这一行的位置（其上方）
// 取出某个节点所有后代对应的行元素（拖动时让子孙跟着一起动）
function descendantRowEls(state,id){
  const node=findNode(state,id);
  if(!node)return [];
  const ids=[];
  (function walk(list){for(const n of list||[]){ids.push(n.id);walk(n.children);}})(node.children);
  const list=document.getElementById(state.listId);
  if(!list)return [];
  return [...list.children].filter(el=>el.dataset&&ids.includes(el.dataset.nodeId));
}

// toId 是不是在 fromId 自己的子树里（防止把一个节点拖进自己的后代，成环）
function isDescendant(state,fromId,toId){
  const from=findNode(state,fromId);
  if(!from)return false;
  let hit=false;
  (function walk(list){for(const n of list||[]){if(n.id===toId){hit=true;return;}walk(n.children);}})(from.children);
  return hit;
}
// 这一行能不能当落点
// asChild=true 时判「能不能当它的爹」，否则判「能不能落在它那一行当兄弟」。
// 已完成的节点不能当爹（规则5：父完成→子孙连带完成，塞未完成的子进去状态自相矛盾），
// 但当兄弟没有从属关系，只是借它那一行的位置排队，所以放开。
function canDropOn(state,fromId,toId,asChild){
  if(fromId===toId)return false;                 // 自己不能落在自己身上
  if(isDescendant(state,fromId,toId))return false; // 不能拖进自己的后代
  const t=findNode(state,toId);
  if(!t)return false;
  if(asChild&&t.completed)return false;
  return true;
}
// 跨层拖动：asChild=true → 成为 toId 的子节点（落在它子列表最前，紧贴它那一行）；
// 否则 → 成为 toId 的兄弟，after 按屏幕行序算（原本在目标上方就落到它之后，反之落到之前）。
function moveTask(state,fromId,toId,asChild,after){
  if(!canDropOn(state,fromId,toId,asChild))return;
  const from=findParentArray(state,fromId);
  if(!from)return;
  const node=from[0][from[1]];
  from[0].splice(from[1],1);                     // 先摘下来（子树跟着节点一起走）
  if(asChild){
    const target=findNode(state,toId);
    if(!target){from[0].splice(from[1],0,node);return;} // 意外找不到就放回原位
    if(!target.children)target.children=[];
    target.children.unshift(node);
    target.collapsed=false;                      // 自动展开，别让东西掉进去看不见
  } else {
    const t=findParentArray(state,toId);         // 摘除后重新定位目标
    if(!t){from[0].splice(from[1],0,node);return;}
    t[0].splice(after?t[1]+1:t[1],0,node);
  }
  renderTaskList(state);
  updateStartBtnState(state);
}
// 某节点的所有兄弟 id（含自己）——同一父数组里的节点
function siblingIdsOf(state,id){
  const loc=findParentArray(state,id);
  return loc?loc[0].map(n=>n.id):[];
}

// 〔手动加一条〕：没选中 = 加一条顶层父任务（落在按钮正下方）；
// 选中 1 条 = 给它加子任务；选中 ≥2 条 = 不可用（按钮已变灰）。加完直接进行内编辑，选中集合不动。
function addManualTask(state){
  if(selCount(state)>=2)return;
  const node=newNode('');
  const sole=soleSel(state);
  const parent=sole!=null?findNode(state,sole):null;
  if(parent){
    if(!parent.children)parent.children=[];
    parent.children.unshift(node);
    parent.collapsed=false;
  } else {
    state.tasks.unshift(node);
  }
  state.editingId=node.id;
  state.open=true;
  if(state.panelBodyId){const b=document.getElementById(state.panelBodyId);if(b)b.style.display='block';}
  renderTaskList(state);
  updateStartBtnState(state);
}

// 单击一条：没选中就选中，已选中就取消选中（逐一取消）；点空白处则整体清空。
// 当且仅当选中恰好 1 条，这条才同步进对话框、在对话框里改。
function selectTask(state,id){
  if(state.singleSelect){
    if(soleSel(state)===id)setSel(state,[]);   // 再点一下同样是取消
    else setSel(state,[id]);
  } else {
    toggleSel(state,id);
  }
  renderTaskList(state);
  syncDialog(state);
  updateStartBtnState(state);
}

// 对话框 = 选中项的编辑器：单选 → 灌进去可改；多选 → 锁住且回到 placeholder；没选 → 空着等新任务
function syncDialog(state){
  if(!state.inputId)return;      // 确认框里没有那个总的对话框
  const inputEl=document.getElementById(state.inputId);
  if(!inputEl)return;
  const sole=soleSel(state);
  if(selCount(state)>=2){
    inputEl.value='';inputEl.disabled=true;
  } else if(sole!=null){
    const node=findNode(state,sole);
    inputEl.value=node?node.text:'';inputEl.disabled=false;
  } else {
    inputEl.value='';inputEl.disabled=false;
  }
  const cc=document.getElementById('charCount');
  if(cc)cc.textContent=inputEl.value.length+' 字';
}

// ── 行内小框框：只用于「刚加出来、还没打过字」的空白条（复用原加子任务那套输入框）──
// 打完点别处/回车即确认；一个字都没打就点别处 → 这条空白任务自动删掉。
function startInlineEdit(state,id){
  state.editingId=id;
  renderTaskList(state);
}
function buildInlineInput(state,node,depth){
  const inp=document.createElement('input');
  inp.type='text';
  inp.placeholder='输入任务内容，点别处即确认';
  inp.style.cssText='flex:1;font-size:13px;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text)';
  const original=node.text||'';
  let done=false;
  const finish=(save)=>{
    if(done)return;done=true;
    const text=save?inp.value.trim():original;   // Esc = 还原原文（原本就是空白条则等于放弃）
    state.editingId=null;
    if(text){node.text=text;}
    else{deleteNodeById(state,node.id);}         // 空内容 = 这条不要了
    renderTaskList(state);
    syncDialog(state);
    updateStartBtnState(state);
  };
  inp.addEventListener('blur',()=>finish(true));
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    else if(e.key==='Escape'){finish(false);}
  });
  inp.addEventListener('pointerdown',e=>e.stopPropagation());
  setTimeout(()=>{inp.focus();inp.select();},0);
  return inp;
}

// ══════════════ 确认框：AI 操作落地前的隔离实例 ══════════════
// = 主树的一份独立副本，拥有全部条目操作，但只能单选；改字靠双击 / 长按就地进行。
// 〔确认〕才把结果写回主列表；〔×〕整个操作取消，框内所有编辑直接丢弃，不二次确认。
let confirmState=null;
let confirmApply=null;   // 点〔确认〕时拿框里最终的 tasks 去改主列表

function openConfirmTree(opts){
  confirmState={
    mode:'confirm', tasks:opts.tasks, selectedIds:[], editingId:null, runningId:null, open:true,
    listId:'confirmTaskList',
    singleSelect:true,   // 框里只能单选
    gestures:true,       // 双击 / 长按〔修改〕只在这里启用
    instant:true         // 叉掉直接生效，不再套一层删除确认
  };
  confirmApply=opts.onConfirm;
  document.getElementById('confirmTreeTitle').textContent=opts.title||'确认';
  document.getElementById('confirmTreeLabel').textContent=opts.label||'结果预览';
  document.getElementById('confirmTreeModal').classList.add('show');
  renderTaskList(confirmState);
}
function closeConfirmTree(){
  closeRowMenu();
  confirmState=null;confirmApply=null;
  document.getElementById('confirmTreeModal').classList.remove('show');
}
function confirmTreeOk(){
  if(!confirmState)return;
  const tasks=confirmState.tasks, apply=confirmApply;
  closeConfirmTree();
  if(apply)apply(tasks);
  renderTaskList(planState);
  syncDialog(planState);
  updateStartBtnState(planState);
}

// ══════════════ 合并 ══════════════
// 选中 N 条 → AI 概括成一条新节点，落在顶层最前；
// 原来那 N 条消失，各自的子孙原地上移一层顶替（被掏空的父留着，变成叶子）。
// 已完成 / 已有反馈的节点不参与——选中里只要有一条这样的，按钮就变灰。
function nodeBlocksMerge(node){
  return !!(node && (node.completed || (node.feedbacks && node.feedbacks.length)));
}
function mergeBlockedIds(state){
  return state.selectedIds.filter(id=>nodeBlocksMerge(findNode(state,id)));
}
// ══════════════ 合并：7 条规则 ══════════════
// 1/2 同父非顶层 → 新节点落该父下最前，被合并节点的子女全部平铺到新节点下
// 3   顶层合并   → 新节点落顶层最前，子女同样平铺到新节点下
// 4/5 不同父同层 → 新节点独立；作为中间步骤时「悬空」（只记层级、不落位），最后一步才落顶层最前
// 6/7 不同父不同层 → 新节点顶替最浅那条的槽位；最浅那条剩下的子女接到新节点上，
//                    其余被合并节点的子女升一级填各自空出来的槽位
// 落点不唯一（最浅那层不止一条）时自动拆步：任意两条必定合法，拆步不暴露给用户。
// 兄弟次序一律按「原树中的出现次序」排，保证结果与拆步路径无关。
function mergeAssignSeq(tasks){let i=0;(function w(l){for(const n of l){n.__seq=i++;w(n.children||[]);}})(tasks);}
function mergeFind(tasks,id){let hit=null;(function w(l){for(const n of l){if(n.id===id){hit=n;return;}w(n.children||[]);}})(tasks);return hit;}
function mergeSortSeq(list){list.sort((a,b)=>((a.__seq==null?-1:a.__seq)-(b.__seq==null?-1:b.__seq)));return list;}

function mergeClassify(tasks,floats,ids){
  const idx={};
  (function w(l,d,p){for(const n of l){idx[n.id]={depth:d,parent:p};w(n.children||[],d+1,n.id);}})(tasks,0,'ROOT');
  const info={};
  ids.forEach(id=>{info[id]=(floats[id]!=null)?{depth:floats[id],parent:'#f:'+id}:idx[id];});
  const depths=ids.map(id=>info[id].depth);
  const dmin=Math.min.apply(null,depths);
  const M=ids.filter(id=>info[id].depth===dmin);
  const sameParent=new Set(ids.map(id=>info[id].parent)).size===1;
  const sameDepth=new Set(depths).size===1;
  const hasKids=ids.some(id=>{
    if(floats[id]!=null)return false;
    const n=mergeFind(tasks,id);return !!(n&&n.children&&n.children.length);
  });
  let rule;
  if(sameParent&&dmin!==0)   rule=hasKids?1:2;
  else if(sameParent)        rule=3;
  else if(sameDepth)         rule=hasKids?4:5;
  else                       rule=hasKids?6:7;
  const unique=(rule===6||rule===7)?(M.length===1):true;
  return {rule,unique,M,info};
}

function mergeStep(tasks,floats,ids,nn,final){
  const c=mergeClassify(tasks,floats,ids);
  const S=new Set(ids);
  const host=(c.rule===6||c.rule===7)?c.M[0]:null;
  const hostIsFloat=host!=null&&floats[host]!=null;
  const flatten=(c.rule<=3);
  let collected=[];
  const rebuild=(list)=>{
    const out=[];
    for(const n of list){
      const kids=rebuild(n.children||[]);
      if(S.has(n.id)){
        if(n.id===host){nn.children=kids;nn.__seq=n.__seq;out.push(nn);}
        else if(flatten){collected=collected.concat(kids);}
        else {for(const k of kids)out.push(k);}   // 子女升一级，填它空出来的槽位
      } else {n.children=kids;out.push(n);}
    }
    return mergeSortSeq(out);
  };
  let t=rebuild(tasks);
  const nf={};Object.keys(floats).forEach(k=>{if(!S.has(k))nf[k]=floats[k];});
  if(c.rule===1||c.rule===2){
    nn.children=mergeSortSeq(collected);nn.__seq=-1;
    const p=mergeFind(t,c.info[ids[0]].parent);
    if(p){p.children.push(nn);mergeSortSeq(p.children);}
  } else if(c.rule===3){
    nn.children=mergeSortSeq(collected);nn.__seq=-1;t.unshift(nn);
  } else if(c.rule===4||c.rule===5){
    if(final){nn.__seq=-1;t.unshift(nn);}
    else nf[nn.id]=c.info[c.M[0]].depth;          // 悬空：只记层级
  } else if(hostIsFloat){
    // 悬空节点没有槽位可顶替 → 悬空性传染，结果继续悬空，只在最后一步落地
    if(final){nn.__seq=-1;t.unshift(nn);}
    else nf[nn.id]=floats[host];
  }
  return {tasks:t,floats:nf};
}

// 返回 {tasks, node}：把 ids 合并成一条标题为 title 的新节点后的整棵树
function computeMerge(tasks,ids,title){
  mergeAssignSeq(tasks);
  let cur=tasks,floats={},sel=ids.slice(),guard=0;
  while(guard++<64){
    const c=mergeClassify(cur,floats,sel);
    if(c.unique){
      const nn=newNode(title);
      return {tasks:mergeStep(cur,floats,sel,nn,true).tasks,node:nn};
    }
    const rep=newNode('');                        // 中间代表，标题最后才生成
    const r=mergeStep(cur,floats,[sel[0],sel[1]],rep,false);
    cur=r.tasks;floats=r.floats;
    sel=sel.slice(2).concat([rep.id]);
  }
  return {tasks:cur,node:null};
}

function onMergeClick(){
  if(selCount(planState)<2)return;
  if(mergeBlockedIds(planState).length)return;
  const ids=planState.selectedIds.slice();
  const picked=ids.map(id=>findNode(planState,id)).filter(Boolean).map(n=>n.text);
  // TODO: 这里接 AI 概括（只要一行标题，结构全部由上面的规则算）；本地先用占位
  const summary=fakeSummarize(picked);
  openConfirmTree({
    title:'合并成一条',
    label:'概括结果',
    tasks:[newNode(summary)],      // 框里只显示一行标题
    onConfirm:(tasks)=>{
      const t=tasks[0];if(!t)return;
      planState.tasks=computeMerge(planState.tasks,ids,t.text).tasks;
      setSel(planState,[]);
    }
  });
}
// 占位概括：AI 接上之前用，纯粹为了能在本地点通
function fakeSummarize(texts){
  const head=(texts[0]||'').replace(/[0-9０-９一二三四五六七八九十]+$/,'').trim();
  return (head||'合并任务')+'（概括占位，共'+texts.length+'条）';
}

// ── 点空白处 = 全部取消选中。空白 = 任务行、按钮、输入框、弹窗之外的一切（含列表里的非任务行和页面背景）──
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-node-id]'))return;
  if(t.closest('button,input,textarea,select,a,label,[data-ui]'))return;
  closeRowMenu();
  if(confirmState){
    // 确认框开着：框内空白清空框内选中；框外空白不动主列表（避免误伤）
    if(t.closest('#confirmTreeModal'))clearSel(confirmState);
    return;
  }
  if(t.closest('.modal-box,.modal-overlay'))return;
  clearSel(planState);
},true);

// AI 拆完后，把当前选中任务回填进统一输入框（沿用旧行为，只是改指向 taskInput）
function showAICurrentTask(text){
  taskInput.value=text;
  if(typeof text==='string')document.getElementById('charCount').textContent=text.length+' 字';
  taskInput.dispatchEvent(new Event('input'));
}

// startSessionFromAI / askAnotherBatch 在合并后不再需要：
// 启动统一走 startSession；「有别的任务要拆」入口已随 modeAI 一起删除。

// AI 拆解作用于统一的 planState + taskInput。
// aiStatus 那个元素已删，状态提示借用 charCount 那一行显示。
function setAiStatus(msg){document.getElementById('charCount').textContent=msg||'';}
async function askAI(){
  if(selCount(planState)>=2)return;   // 锁死单选：多选时按钮已变灰，这里再兜底一次
  // 无状态、无追问、无对话历史的一次性拆解器：每次只发「系统 prompt + 这一次的内容」
  const sole=soleSel(planState);
  const target=sole!=null?findNode(planState,sole):null;
  // 2.1：选中的这条经历过拆解流程（AI 的产物或被拆过）→ 顺着它往下长，父就是它
  // 2.2：没有标记 → 这条是一堆字不是任务名，父由模型新起
  const mode=(target&&target.aiTouched)?'2.1':'2.2';
  const input=target?(target.text||'').trim():taskInput.value.trim();
  if(!input)return;

  const btn=document.getElementById('aiAskBtn');
  btn.disabled=true;btn.textContent='AI思考中…';

  try{
    const res=await fetch(AI_PROXY_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        messages:[
          {role:'system',content:AI_SYSTEM_PROMPT},
          {role:'user',content:buildAiUserMessage(mode,input,target)}
        ]
      })
    });
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      if(res.status===401||res.status===403) setAiStatus('AI 服务暂不可用，请联系工具作者');
      else setAiStatus('请求失败：'+(err.error?.message||res.status));
      btn.disabled=false;btn.textContent='让AI来拆 ✦';return;
    }
    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content?.trim()||'';
    handleAiReply(reply,target);
  }catch(e){
    setAiStatus('网络错误，请检查连接');
  }
  btn.disabled=false;btn.textContent='让AI来拆 ✦';
}

// 2.1 要把原有子树一并喂过去，否则模型会拆出重复的子任务
function buildAiUserMessage(mode,input,target){
  // 已有的子任务一律喂给模型：它是无状态的，不写进这条消息它就看不见，挡不住重复
  const kids=target?(target.children||[]).map(c=>'  - '+c.text).join('\n'):'';
  const kidsBlock=kids?('\n它已有的子任务（新拆的不要和这些重复，换个说法表达同一件事也算重复）：\n'+kids):'';
  if(mode==='2.1'){
    return '请顺着下面这条任务往下拆一层子任务。\n'+
      '第一行请照抄原任务名，不要改写。\n任务：'+input+kidsBlock;
  }
  return '下面这段内容是一段随手写的话，不是任务名。\n'+
    '请提炼出它的行动锚点作为父任务名（不要只截取其中一句），再拆出子任务。\n内容：'+input+kidsBlock;
}

// 解析 + 落地。整段失败就什么都不动，让用户重试。
function handleAiReply(reply,target){
  const parsed=parseNumberedTree(reply);
  if(!parsed.ok){
    setAiStatus('AI 返回格式不对，再试一次');
    return;
  }
  const tree=parsed.node;
  const newKids=tree.children.slice();      // 模型这次新生成的那几条，只有它们该被打标记
  // 子任务一律保留：原有的在前、新拆的并在后面，由用户在确认框里取舍。
  // 2.2 的节点本来就没有子任务，所以这里对它是空操作，不需要分模式。
  if(target)tree.children=(target.children||[]).concat(tree.children);
  // 列表空时的初始拆直接落地，不弹框；非空时的 AI 操作都走确认框
  if(!planState.tasks.length){
    applyAiTree(target,tree,newKids);
    return;
  }
  openConfirmTree({
    title:'确认拆解结果',
    label:'拆解结果',
    tasks:[tree],
    onConfirm:(tasks)=>{
      const t=tasks[0];
      if(!t)return;
      applyAiTree(target,t,newKids);
    }
  });
}

// 应用拆解结果到统一列表 planState（这一批：AI 结果作为顶层节点）
// ══════════════ AI 拆解结果：解析 → 落地 ══════════════
// 约定的输出：一级编号 = 父，二级编号 = 子，最多两层，且只准一个一级编号。
// 不容错：出现三级、多个一级、或任何非编号行（开场白 / 总结 / 评价）→ 整段失败。
// 返回 {ok:true,node} 或 {ok:false,why}
function parseNumberedTree(reply){
  const lines=(reply||'').split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  if(!lines.length)return {ok:false,why:'空回复'};
  let root=null;
  for(const line of lines){
    const m=line.match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?[\.、。\)）]?\s*(.*)$/);
    if(!m)return {ok:false,why:'不是编号行：'+line};
    if(m[3])return {ok:false,why:'出现三级编号：'+line};
    const text=(m[4]||'').trim();
    if(!text)return {ok:false,why:'编号后没有内容：'+line};
    if(m[2]===undefined){                    // 一级
      if(root)return {ok:false,why:'出现了多个一级编号'};
      root=newNode(text);
    } else {                                  // 二级
      if(!root)return {ok:false,why:'子任务出现在父任务之前'};
      root.children.push(newNode(text));
    }
  }
  if(!root)return {ok:false,why:'没有一级编号'};
  return {ok:true,node:root};
}

// 打上「经历过拆解流程」的标记：有标记的下次走 2.1，没标记的走 2.2
function markAiTouched(node){
  node.aiTouched=true;
  (node.children||[]).forEach(markAiTouched);
}
// 只给「模型这次新生成的那几条」打标记。标记逐节点独立、不沿树传播，
// 所以接进来的旧子树（可能是你手动加的）原样不动。
function markAiTouchedNew(root,newKids){
  root.aiTouched=true;
  (newKids||[]).forEach(markAiTouched);
}

// 把一棵新树替换到目标节点原来的位置（2.1 / 2.2 共用）
function replaceNodeWith(state,targetId,newTree){
  const loc=findParentArray(state,targetId);
  if(!loc)return false;
  loc[0].splice(loc[1],1,newTree);
  return true;
}

// 拆解结果落地。targetId 为 null = 列表原本是空的，直接落到顶层。
// 这里是「当天任务树定稿」的唯一收口，将来要做跨天历史存档就挂在这一处。
function applyAiTree(target,tree,newKids){
  markAiTouchedNew(tree,newKids);
  let landed=tree;
  if(target&&findNode(planState,target.id)){
    if(target.aiTouched){
      // 2.1：这条留着，只往它底下加子任务。节点对象自始至终是同一个，
      // 所以反馈、完成状态、id 不需要任何人搬运，天然就在。模型返回的父名丢弃，沿用原名。
      target.children=tree.children;
      target.aiTouched=true;
      landed=target;
    } else {
      // 2.2：这条只是一段随手写的话，语义上就该被 AI 起的任务名替换掉。
      // 这种节点没被专注过，身上不会有反馈，没有东西需要接住。
      replaceNodeWith(planState,target.id,tree);
    }
  } else {
    planState.tasks.unshift(tree);
  }
  setSel(planState,[landed.id]);
  planState.editingId=null;
  renderTaskList(planState);
  syncDialog(planState);
  updateStartBtnState(planState);
}
